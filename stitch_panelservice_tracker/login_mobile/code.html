<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - PanelService</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#004ac6",
                        "inverse-surface": "#2e3132",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "surface-container-high": "#e7e8e9",
                        "background": "#f8f9fa",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#bc4800",
                        "secondary": "#505f76",
                        "surface-container": "#edeeef",
                        "on-tertiary-container": "#ffede6",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f8f9fa",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#d3e4fe",
                        "tertiary": "#943700",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f3f4f5",
                        "on-surface-variant": "#434655",
                        "outline-variant": "#c3c6d7",
                        "inverse-primary": "#b4c5ff",
                        "on-error": "#ffffff",
                        "on-surface": "#191c1d",
                        "on-primary-container": "#eeefff",
                        "on-background": "#191c1d",
                        "surface-tint": "#0053db",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-dim": "#d9dadb",
                        "secondary-container": "#d0e1fb",
                        "on-primary-fixed": "#00174b",
                        "surface": "#f8f9fa",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-secondary-container": "#54647a",
                        "outline": "#737686",
                        "primary-fixed-dim": "#b4c5ff",
                        "surface-variant": "#e1e3e4",
                        "secondary-fixed-dim": "#b7c8e1",
                        "tertiary-fixed": "#ffdbcd",
                        "tertiary-fixed-dim": "#ffb596",
                        "primary-container": "#2563eb",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-tertiary-fixed": "#360f00",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "surface-container-highest": "#e1e3e4",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "sm": "8px",
                        "xs": "4px",
                        "gutter": "20px",
                        "base": "4px",
                        "xl": "32px",
                        "lg": "24px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "code": ["jetbrainsMono"],
                        "h2": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "h1-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "h1": ["Inter"]
                    },
                    "fontSize": {
                        "code": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "h2": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "h1-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "h1": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }]

                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-md sm:p-lg md:p-xl">
<div class="w-full max-w-sm bg-surface-container-lowest rounded-xl shadow-[0px_1px_3px_rgba(0,0,0,0.1),_0px_1px_2px_rgba(0,0,0,0.06)] p-lg flex flex-col gap-xl">
<!-- Header -->
<div class="text-center space-y-sm">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary mb-sm">
<span class="material-symbols-outlined text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                        admin_panel_settings
                    </span>
</div>
<h1 class="font-h1-mobile text-h1-mobile text-on-surface">PanelService</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to manage your tickets.</p>
</div>
<!-- Login Form -->
<form class="space-y-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="w-full h-[48px] rounded border border-outline-variant bg-surface-container-lowest px-md font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:shadow-[0_0_0_3px_rgba(37,99,235,0.2)] transition-shadow placeholder:text-on-surface-variant/50" id="email" placeholder="admin@panelservice.com" required="" type="email"/>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full h-[48px] rounded border border-outline-variant bg-surface-container-lowest px-md font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:shadow-[0_0_0_3px_rgba(37,99,235,0.2)] transition-shadow placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div class="pt-sm">
<button class="w-full h-[48px] rounded-lg bg-primary text-on-primary font-body-md text-body-md font-semibold hover:bg-primary-fixed-variant active:opacity-80 transition-all shadow-sm" type="submit">
                        Sign In
                    </button>
</div>
</form>
<div class="text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? <a class="text-primary hover:underline" href="#">Contact Support</a>
</p>
</div>
</div>
</main>
</body></html>
