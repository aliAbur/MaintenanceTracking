<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>PanelService - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "secondary-container": "#d0e1fb",
                        "tertiary": "#943700",
                        "error": "#ba1a1a",
                        "primary-fixed": "#dbe1ff",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-background": "#191c1d",
                        "primary-container": "#2563eb",
                        "surface-variant": "#e1e3e4",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#0b1c30",
                        "inverse-primary": "#b4c5ff",
                        "secondary": "#505f76",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-bright": "#f8f9fa",
                        "surface-container-high": "#e7e8e9",
                        "surface-container-highest": "#e1e3e4",
                        "surface": "#f8f9fa",
                        "outline-variant": "#c3c6d7",
                        "on-secondary-fixed-variant": "#38485d",
                        "secondary-fixed": "#d3e4fe",
                        "inverse-surface": "#2e3132",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#ffede6",
                        "on-primary-fixed": "#00174b",
                        "outline": "#737686",
                        "on-surface-variant": "#434655",
                        "tertiary-container": "#bc4800",
                        "tertiary-fixed-dim": "#ffb596",
                        "surface-dim": "#d9dadb",
                        "surface-container-low": "#f3f4f5",
                        "primary": "#004ac6",
                        "on-tertiary-fixed": "#360f00",
                        "on-primary": "#ffffff",
                        "on-surface": "#191c1d",
                        "on-primary-container": "#eeefff",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-container": "#edeeef",
                        "surface-tint": "#0053db",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-secondary-container": "#54647a",
                        "background": "#f8f9fa"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "20px",
                        "container-max": "1280px",
                        "sm": "8px",
                        "xl": "32px",
                        "xs": "4px",
                        "md": "16px",
                        "lg": "24px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter", "sans-serif"],
                        "h1-mobile": ["Inter", "sans-serif"],
                        "code": ["JetBrains Mono", "monospace"],
                        "h1": ["Inter", "sans-serif"],
                        "label-md": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "h2": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "h1-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "code": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "h1": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "h2": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface-container-low text-on-surface antialiased min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-surface-container-lowest rounded-lg shadow-sm border border-outline-variant/30 p-8">
<!-- Header -->
<div class="text-center mb-8">
<div class="flex items-center justify-center gap-2 mb-2">
<span aria-hidden="true" class="material-symbols-outlined text-primary text-3xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    dashboard
                </span>
<h1 class="text-h2 text-on-surface">PanelService</h1>
</div>
<p class="text-body-sm text-on-surface-variant">Sign in to your workspace</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Email -->
<div>
<label class="block text-body-sm font-medium text-on-surface mb-2" for="email">Email address</label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors placeholder:text-outline" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
<!-- Password -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="block text-body-sm font-medium text-on-surface" for="password">Password</label>
<a class="text-body-sm text-primary hover:text-primary-fixed-dim transition-colors font-medium" href="#">Forgot password?</a>
</div>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors placeholder:text-outline" id="password" name="password" placeholder="Enter password" required="" type="password">
</div>
<!-- Keep signed in -->
<div class="flex items-center">
<input class="h-5 w-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface transition-colors" id="remember" name="remember" type="checkbox">
<label class="ml-3 block text-body-sm text-on-surface" for="remember">Keep me signed in</label>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-medium text-body-md hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors flex justify-center items-center" type="submit">
                Sign In
            </button>
</form>
<!-- Footer -->
<div class="mt-8 text-center text-body-sm text-on-surface-variant">
            Don't have an account? <a class="text-primary hover:text-primary-fixed-dim font-medium transition-colors" href="#">Request access</a>
</div>
</div>
</body></html>
