<style>

<body class="bg-background text-on-background h-full font-body-md text-body-md flex flex-col antialiased">
<!-- TopAppBar (Transactional - Hidden Navigation Shell equivalent, simplified back) -->
<header class="bg-surface w-full top-0 sticky border-b border-surface-variant shadow-sm z-10 flex justify-between items-center px-md py-sm w-full">
<div class="flex items-center gap-sm">
<button class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors active:opacity-80">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h1-mobile text-h1-mobile text-primary">Add New Maintenance</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow p-md pb-[100px] overflow-y-auto">
<form class="flex flex-col gap-lg max-w-[600px] mx-auto">
<!-- Customer Information Section -->
<section class="bg-surface-container-lowest rounded-xl p-md shadow-sm border border-surface-variant flex flex-col gap-md">
<h2 class="font-h2 text-h2 text-on-surface border-b border-surface-variant pb-sm">Customer Details</h2>
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="customerName">Customer Name</label>
<input class="h-[48px] rounded-lg border border-outline px-sm focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow bg-surface-container-lowest text-on-surface placeholder:text-outline-variant font-body-md text-body-md" id="customerName" placeholder="e.g. Jane Doe" type="text"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="customerPhone">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="call">call</span>
<input class="h-[48px] w-full rounded-lg border border-outline pl-10 pr-sm focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow bg-surface-container-lowest text-on-surface placeholder:text-outline-variant font-body-md text-body-md" id="customerPhone" placeholder="(555) 123-4567" type="tel"/>
</div>
</div>
</section>
<!-- Technical Details Section -->
<section class="bg-surface-container-lowest rounded-xl p-md shadow-sm border border-surface-variant flex flex-col gap-md">
<h2 class="font-h2 text-h2 text-on-surface border-b border-surface-variant pb-sm">Technical Details</h2>
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="panelType">Panel Type</label>
<div class="relative">
<select class="h-[48px] w-full rounded-lg border border-outline px-sm appearance-none focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow bg-surface-container-lowest text-on-surface font-body-md text-body-md" id="panelType">
<option disabled="" selected="" value="">Select panel type...</option>
<option value="monocrystalline">Monocrystalline</option>
<option value="polycrystalline">Polycrystalline</option>
<option value="thin-film">Thin-Film</option>
<option value="other">Other</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Priority Level</label>
<div class="grid grid-cols-3 gap-sm">
<!-- Low Priority -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="priority" type="radio" value="low"/>
<div class="rounded-lg border border-outline p-sm flex flex-col items-center justify-center gap-xs peer-checked:border-primary peer-checked:bg-secondary-container peer-checked:text-on-secondary-container transition-all text-on-surface-variant hover:bg-surface-container-low h-full">
<span class="material-symbols-outlined" data-icon="low_priority">low_priority</span>
<span class="font-label-md text-label-md">Low</span>
</div>
</label>
<!-- Medium Priority -->
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="priority" type="radio" value="medium"/>
<div class="rounded-lg border border-outline p-sm flex flex-col items-center justify-center gap-xs peer-checked:border-tertiary-container peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container transition-all text-on-surface-variant hover:bg-surface-container-low h-full">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
<span class="font-label-md text-label-md">Medium</span>
</div>
</label>
<!-- High Priority -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="priority" type="radio" value="high"/>
<div class="rounded-lg border border-outline p-sm flex flex-col items-center justify-center gap-xs peer-checked:border-error peer-checked:bg-error-container peer-checked:text-on-error-container transition-all text-on-surface-variant hover:bg-surface-container-low h-full">
<span class="material-symbols-outlined" data-icon="priority_high">priority_high</span>
<span class="font-label-md text-label-md">High</span>
</div>
</label>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="specialNotes">Special Notes</label>
<textarea class="rounded-lg border border-outline p-sm focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow bg-surface-container-lowest text-on-surface placeholder:text-outline-variant font-body-md text-body-md resize-y" id="specialNotes" placeholder="Add any relevant details about the issue or site access..." rows="4"></textarea>
</div>
</section>
</form>
</main>
<!-- Bottom Action Bar (Sticky) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-surface-variant p-md shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20">
<div class="flex gap-md max-w-[600px] mx-auto">
<button class="flex-1 bg-surface-container-lowest border border-outline-variant text-secondary font-label-md text-label-md h-[48px] rounded-lg flex items-center justify-center gap-xs hover:bg-surface-container-low transition-colors active:scale-95" type="button">
                 Cancel
            </button>
<button class="flex-[2] bg-primary-container text-on-primary font-label-md text-label-md h-[48px] rounded-lg flex items-center justify-center gap-xs shadow-sm hover:opacity-90 transition-opacity active:scale-95" type="submit">
<span class="material-symbols-outlined" data-icon="add_task">add_task</span>
                Create Ticket
            </button>
</div>
</div>
</body></html>
