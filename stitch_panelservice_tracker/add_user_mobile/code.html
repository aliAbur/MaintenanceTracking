<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

                        "surface-variant": "#e1e3e4",
                        "secondary-fixed-dim": "#b7c8e1",

                        "tertiary-fixed-dim": "#ffb596",
                        "primary-container": "#2563eb",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-tertiary-fixed": "#360f00",
                        "on-primary": "#ffffff",

                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    },
                    "spacing": {

                        "gutter": "20px",

                        "container-max": "1280px",
                        "safe": "env(safe-area-inset-bottom)"
                    },
                    "fontFamily": {

<style>
        body { -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
        .input-glow:focus { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); border-color: #2563EB; }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col md:hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface w-full top-0 sticky shadow-sm border-b border-surface-variant dark:border-outline-variant z-40">
<div class="flex justify-between items-center px-md py-sm w-full">
<div class="flex items-center gap-sm">
<button aria-label="Go back" class="p-sm rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors active:opacity-80">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-h1-mobile text-h1-mobile text-primary dark:text-primary-fixed-dim">Add New User</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden shadow-sm flex-shrink-0">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional headshot of a corporate employee on a plain light grey background. The person is smiling slightly, wearing a neat navy blue collared shirt. The lighting is soft and even, typical of a modern office ID badge photo. The image conveys trust and competence in a business setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZuNMm_E-7CfeIANU2grkGZsq7Pxjb3mbAK1X6vm__k8-tfDidaxOAPjSBaN7Kd4IzwIZJcJxpD4-fwmLjVJ35g1kebhxmHK8uxQQbn0tOJcDvyxsaBw3LMlVhQSr6SF0pJSntRBIedtmTxgeZ9r0BcSnLsgH1fYsNLdwwSBbJtA0grox4gHuiFN2Xyp4p53nbF3g3DiwdqBWIFQq2EoenMRi3P0D5QL06pDZA3TLBwMKxPrsHl-UX"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pb-32 px-md py-lg space-y-xl">
<!-- Personal Info Section -->
<section class="bg-surface-container-lowest rounded-lg p-md shadow-sm border border-surface-variant">
<h2 class="font-h2 text-h2 mb-md text-on-surface flex items-center gap-sm">
<span class="material-symbols-outlined text-primary">person</span>
                Personal Info
            </h2>
<div class="space-y-md">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="fullName">Full Name</label>
<input class="w-full h-[48px] px-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface input-glow focus:outline-none" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Email Address</label>
<input class="w-full h-[48px] px-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface input-glow focus:outline-none" id="email" placeholder="jane@example.com" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="phone">Phone Number</label>
<input class="w-full h-[48px] px-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface input-glow focus:outline-none" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="password">Temporary Password</label>
<input class="w-full h-[48px] px-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface input-glow focus:outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
</section>
<!-- Role & Permissions Section -->
<section class="bg-surface-container-lowest rounded-lg p-md shadow-sm border border-surface-variant">
<h2 class="font-h2 text-h2 mb-md text-on-surface flex items-center gap-sm">
<span class="material-symbols-outlined text-primary">admin_panel_settings</span>
                Role &amp; Permissions
            </h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-md">Select the appropriate access level for this user.</p>
<div class="space-y-sm">
<!-- Admin Role -->
<label class="flex items-start gap-md p-sm rounded border border-outline-variant bg-surface-container-lowest hover:bg-surface-bright cursor-pointer transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-fixed">
<div class="flex-shrink-0 pt-xs">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary" name="role" type="radio" value="admin"/>
</div>
<div class="flex-1">
<span class="block font-body-md text-body-md font-semibold text-on-surface">Admin</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant">Full access to all settings, user management, and sensitive data.</span>
</div>
</label>
<!-- Employee Role -->
<label class="flex items-start gap-md p-sm rounded border border-outline-variant bg-surface-container-lowest hover:bg-surface-bright cursor-pointer transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-fixed">
<div class="flex-shrink-0 pt-xs">
<input checked="" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary" name="role" type="radio" value="employee"/>
</div>
<div class="flex-1">
<span class="block font-body-md text-body-md font-semibold text-on-surface">Employee</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant">Standard access to perform daily tasks and manage own tickets.</span>
</div>
</label>
<!-- Observer Role -->
<label class="flex items-start gap-md p-sm rounded border border-outline-variant bg-surface-container-lowest hover:bg-surface-bright cursor-pointer transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-fixed">
<div class="flex-shrink-0 pt-xs">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary" name="role" type="radio" value="observer"/>
</div>
<div class="flex-1">
<span class="block font-body-md text-body-md font-semibold text-on-surface">Observer</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant">Read-only access to reports and dashboard metrics.</span>
</div>
</label>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-surface-variant p-md pb-[calc(16px+env(safe-area-inset-bottom))] shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-40">
<button class="w-full h-[48px] bg-primary text-on-primary font-body-md text-body-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm">
<span class="material-symbols-outlined">person_add</span>
            Create User
        </button>
</div>
</body></html>
